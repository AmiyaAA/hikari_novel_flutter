          humzJ/TmMA0GCSqGSIb3DQEBDAUAA4IBAQAvhLHZvn7XX7cLnGT3eD9dRVVOIL8YOQxoq4evFr9p
          8VLVuJkbqQ5pBVvHoklxi3FIZKEEqszhIAUCN+43SbZATLRoeM5a8tvNLEYr3w3n7IJiweh9TQb4
          s6bKN/2Ym3nsGGM/LT3h+1cHGJK9LRFsttlr+pcvWb+JPnf3tP32ZII6hLwY5rwzeSIqAOmjdWaj
          +9zNZlBPdB1RfTybK6wipU/bSNAGcRrSJltpuO1nx1gTixAYU6qJ4sd3/vm5hF8Buvu1CLHH8ObY
          lMUAuV+ivlcub7+srHdpFhXUvj63a0HlFCIFXR4JpYUPR/1gUalWEUf3De1dmRZkzH7cp7nISdRW
          NsHd9PB5x7422sjMmiBpIqM=
          """
          open("android/app/release.jks", "wb").write(base64.b64decode(b64))
          '

      # 7. 编译 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. 使用固定的私钥对 APK 进行二进制重签名
      - name: Sign APK with Fixed Key
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias hikari \
            --ks-pass pass:hikari123456 \
            --key-pass pass:hikari123456 \
            --out build/app/outputs/flutter-apk/HikariNovel_${{ env.TAG_NAME }}.apk \
            build/app/outputs/flutter-apk/app-release.apk

      # 9. 保底方案：上传产物到 Actions 运行页面供随时直接下载
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HikariNovel_${{ env.TAG_NAME }}
          path: build/app/outputs/flutter-apk/HikariNovel_${{ env.TAG_NAME }}.apk

      # 10. 发布到 GitHub Releases 页面
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Hikari Novel ${{ env.TAG_NAME }}"
          body: |
            ## 🚀 自动构建与同步发布
            - **同步上游版本**: `${{ env.TAG_NAME }}` (Build ${{ env.BUILD_NUM }})
            - **签名状态**: ✅ 已完成永久固定密钥签名（支持无缝覆盖升级）
            
            > **提示**：安装过本版本的用户，以后有新版可直接下载点击**覆盖升级**，无需卸载旧版。
          files: build/app/outputs/flutter-apk/HikariNovel_${{ env.TAG_NAME }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
