name: Build & Release Flutter APK

on:
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发
  push:
    branches:
      - main
      - master # 当自动同步上游拉取代码并 push 到主分支时，自动触发编译与发布

permissions:
  contents: write # 赋予 GitHub Actions 创建 Release 和上传 Tag 的权限

jobs:
  build-and-release:
    name: Build Signed APK & Create Release
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Java 17 环境
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 获取项目依赖
      - name: Install dependencies
        run: flutter pub get

      # 5. 从 pubspec.yaml 自动解析上游版本号（增强容错）
      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          RAW_VER=$(grep -E '^\s*version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER_NAME=$(echo $RAW_VER | cut -d '+' -f 1)
          BUILD_NUM=$(echo $RAW_VER | cut -d '+' -f 2)

          if [ -z "$VER_NAME" ]; then
            VER_NAME="1.0.0"
          fi

          TAG_NAME="v${VER_NAME}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VER_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "Extracted Upstream Version: ${TAG_NAME} (Build ${BUILD_NUM})"

