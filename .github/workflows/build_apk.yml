name: Build & Release Flutter APK

on:
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发
  push:
    branches:
      - main
      - master # 当自动同步上游拉取代码并 push 到主分支时，自动触发编译与发布

permissions:
  contents: write # 赋予 GitHub Actions 创建 Release 和上传 Tag 的权限

jobs:
  build-and-release:
    name: Build Signed APK & Create Release
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Java 17 环境
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 获取项目依赖
      - name: Install dependencies
        run: flutter pub get

      # 5. 从 pubspec.yaml 自动解析上游版本号
      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER_NAME=$(echo $RAW_VER | cut -d '+' -f 1)
          BUILD_NUM=$(echo $RAW_VER | cut -d '+' -f 2)

          TAG_NAME="v${VER_NAME}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VER_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "Extracted Upstream Version: ${TAG_NAME} (Build ${BUILD_NUM})"

      # 6. 还原永久固定的签名 Key (使用 Python 兼容解码，跨平台无痛解包)
      - name: Restore Fixed Keystore
        run: |
          mkdir -p android/app
          python3 -c '
          import base64
          b64 = """"""
          open("android/app/release.jks", "wb").write(base64.b64decode(b64.strip()))
          '

      # 7. 编译 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. 使用固定的私钥对 APK 进行二进制重签名
      - name: Sign APK with Fixed Key
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias hikari \
            --ks-pass pass:hikari123456 \
            --key-pass pass:hikari123456 \
            --out build/app/outputs/flutter-apk/HikariNovel_${{ env.TAG_NAME }}.apk \
            build/app/outputs/flutter-apk/app-release.apk

      # 9. 自动发布到 GitHub Releases 页面
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Hikari Novel ${{ env.TAG_NAME }}"
          body: |
            ## 🚀 自动构建与同步发布
            - **同步上游版本**: `${{ env.TAG_NAME }}` (Build ${{ env.BUILD_NUM }})
            - **签名状态**: ✅ 已完成永久固定密钥签名（支持覆盖升级）
            
            > **提示**：从本次及以后的编译版本起，签名均已统一。**可以直接点击安装进行覆盖升级**，无需卸载旧版。
          files: build/app/outputs/flutter-apk/HikariNovel_${{ env.TAG_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
